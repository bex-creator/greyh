<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Debian Desktop</title>
    <!-- Load v86 Engine from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js"></script>
    <style>
        body { 
            background: #121212; 
            color: #ffffff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
        }
        #setup_box {
            background: #222;
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
        }
        #screen_container {
            width: 1024px;
            height: 768px;
            border: 2px solid #444;
            background: #000;
            display: none;
        }
        canvas { width: 100%; height: 100%; cursor: none; }
        input[type="file"] { margin-top: 15px; font-size: 15px; }
    </style>
</head>
<body>
    <h2>Debian Desktop</h2>

    <div id="setup_box">
        <h3>Load Local Operating System</h3>
        <p>Select your downloaded Debian Live ISO from your Chromebook:</p>
        <input type="file" id="iso_picker" accept=".iso">
    </div>

    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace;"></div>
        <canvas></canvas>
    </div>

    <script>
        document.getElementById('iso_picker').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Hide setup UI and reveal the VM display
            document.getElementById('setup_box').style.display = 'none';
            document.getElementById('screen_container').style.display = 'block';

            // Point v86 directly to the local file selected on your disk
            const localIsoUrl = URL.createObjectURL(file);

            const emulator = new window.V86({
                wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
                memory_size: 1024 * 1024 * 1024, // 1GB RAM
                vga_memory_size: 32 * 1024 * 1024,
                
                screen_container: document.getElementById("screen_container"),
                
                bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/seabios.bin" },
                vga_bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/vgabios.bin" },
                
                cdrom: { 
                    url: localIsoUrl, 
                    async: true 
                },
                
                autostart: true
            });
        });
    </script>
</body>
</html>
