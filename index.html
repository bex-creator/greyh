<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Debian Desktop</title>
    <!-- Load v86 WebAssembly Engine -->
    <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js"></script>
    <style>
        body { 
            background: #121212; 
            color: #ffffff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
        }
        #controls {
            background: #222;
            border: 2px dashed #555;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        #loading_box {
            display: none;
            width: 400px;
            text-align: center;
            margin-bottom: 20px;
        }
        #progress_bar_container {
            width: 100%;
            height: 18px;
            background-color: #333;
            border-radius: 9px;
            overflow: hidden;
            border: 1px solid #555;
            margin-top: 10px;
        }
        #progress_bar {
            width: 0%;
            height: 100%;
            background-color: #3b82f6;
            transition: width 0.2s ease;
        }
        #status_text {
            font-size: 14px;
            color: #ccc;
            margin-top: 8px;
        }
        #screen_container {
            width: 1024px;
            height: 768px;
            border: 2px solid #444;
            background: #000;
            display: none;
        }
        canvas { width: 100%; height: 100%; cursor: none; }
        input[type="file"] { margin-top: 12px; font-size: 15px; }
    </style>
</head>
<body>
    <h2>Debian Desktop</h2>

    <div id="controls">
        <h3>Select Your Linux ISO</h3>
        <p>Choose your downloaded ISO file to boot:</p>
        <input type="file" id="iso_file" accept=".iso">
    </div>

    <!-- Loading Bar UI -->
    <div id="loading_box">
        <div id="status_text">Loading WebAssembly & BIOS assets...</div>
        <div id="progress_bar_container">
            <div id="progress_bar"></div>
        </div>
    </div>

    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace;"></div>
        <canvas></canvas>
    </div>

    <script>
        document.getElementById('iso_file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // UI Elements
            const controls = document.getElementById('controls');
            const loadingBox = document.getElementById('loading_box');
            const progressBar = document.getElementById('progress_bar');
            const statusText = document.getElementById('status_text');
            const screenContainer = document.getElementById('screen_container');

            // Hide file picker, show loading bar
            controls.style.display = 'none';
            loadingBox.style.display = 'block';

            const localIsoUrl = URL.createObjectURL(file);

            const emulator = new window.V86({
                wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
                
                memory_size: 512 * 1024 * 1024, 
                vga_memory_size: 16 * 1024 * 1024,
                
                screen_container: screenContainer,
                
                bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/seabios.bin" },
                vga_bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/vgabios.bin" },
                
                cdrom: { 
                    url: localIsoUrl, 
                    async: true 
                },
                
                autostart: true
            });

            // Track WASM & BIOS asset downloads
            emulator.add_listener("download-progress", function(progress) {
                if (progress.lengthComputable || (progress.loaded && progress.total)) {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    progressBar.style.width = percent + "%";
                    statusText.innerText = "Downloading assets... " + percent + "%";
                } else {
                    progressBar.style.width = "50%";
                    statusText.innerText = "Loading system assets into RAM...";
                }
            });

            // Update status when VM starts executing CPU instructions
            emulator.add_listener("emulator-ready", function() {
                progressBar.style.width = "90%";
                statusText.innerText = "Initializing WebAssembly CPU & mounting ISO...";
            });

            // Once the display outputs its first screen update, hide loader and reveal display
            const onFirstFrame = function() {
                progressBar.style.width = "100%";
                statusText.innerText = "Boot sequence started!";
                
                setTimeout(() => {
                    loadingBox.style.display = 'none';
                    screenContainer.style.display = 'block';
                }, 300);

                emulator.remove_listener("screen-fill-rect", onFirstFrame);
            };

            emulator.add_listener("screen-fill-rect", onFirstFrame);
        });
    </script>
</body>
</html>
