<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python WASM Directory Sandbox</title>
    <!-- Load Pyodide WASM Runtime Layer -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0; padding: 20px;
            background-color: #121214; color: #e1e1e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #sandbox-wrapper {
            max-width: 900px; margin: 0 auto;
        }
        header h1 { margin-bottom: 5px; color: #ffca28; }
        header p { color: #a4a4a4; margin-top: 0; }

        #drop-zone {
            border: 3px dashed #44475a; border-radius: 8px;
            padding: 60px 20px; text-align: center;
            background: #1d1f27; cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        #drop-zone.hovering {
            border-color: #ffca28; background: #282a36;
        }
        .prompt-content .icon { font-size: 3rem; display: block; margin-bottom: 10px; }
        .prompt-content p { font-size: 1.2rem; margin: 0; font-weight: bold; }

        #status-message {
            margin: 20px 0; font-weight: bold; color: #ffb86c; font-family: monospace;
        }

        .terminal-container {
            background: #000; border-radius: 6px; padding: 15px;
            border: 1px solid #333; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .terminal-container h3 { margin-top: 0; color: #8be9fd; font-size: 0.9rem; text-transform: uppercase; }
        #console-output {
            margin: 0; white-space: pre-wrap; word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace; color: #f8f8f2; font-size: 0.95rem;
            max-height: 400px; overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="sandbox-wrapper">
        <header>
            <h1>🐍 Python Local Folder Sandbox</h1>
            <p>Drag an entire development folder containing your <code>main.py</code> and assets below.</p>
        </header>

        <!-- Drag & Drop Interface Target -->
        <div id="drop-zone">
            <div class="prompt-content">
                <span class="icon">📁</span>
                <p>Drop your project folder here</p>
                <small>(Must contain a <code>main.py</code> file)</small>
            </div>
        </div>

        <div id="status-message">Initializing WebAssembly Machine...</div>

        <!-- Terminal Output View -->
        <div class="terminal-container">
            <h3>Terminal Output:</h3>
            <pre id="console-output"></pre>
        </div>
    </div>

    <script>
        let pyodideInstance = null;
        const outputConsole = document.getElementById('console-output');
        const statusLabel = document.getElementById('status-message');
        const dropTarget = document.getElementById('drop-zone');

        // 1. Boot up the WebAssembly Python environment
        async function initSandboxEngine() {
            try {
                pyodideInstance = await loadPyodide({
                    stdout: (text) => { outputConsole.textContent += text + '\n'; },
                    stderr: (text) => { outputConsole.textContent += '[ERROR] ' + text + '\n'; }
                });
                statusLabel.innerText = "System Ready. Please drop your directory folder.";
                statusLabel.style.color = "#00ff00";
            } catch (err) {
                statusLabel.innerText = "WASM Initialization Failed.";
                console.error(err);
            }
        }

        // 2. Prevent default OS actions on browser drops
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropTarget.addEventListener(eventName, (e) => e.preventDefault(), false);
        });

        dropTarget.addEventListener('dragover', () => dropTarget.classList.add('hovering'));
        dropTarget.addEventListener('dragleave', () => dropTarget.classList.remove('hovering'));

        dropTarget.addEventListener('drop', async (e) => {
            dropTarget.classList.remove('hovering');
            if (!pyodideInstance) return;

            outputConsole.textContent = ""; // Clear log frames
            statusLabel.innerText = "Reading file tree assets...";
            
            // Snag dropped items using the DataTransfer API
            const items = e.dataTransfer.items;
            if (items && items.length > 0) {
                const entry = items[0].webkitGetAsEntry();
                if (entry.isDirectory) {
                    await clearVirtualFileSystem();
                    await scanAndInjectDirectory(entry, "/");
                    runPythonExecution();
                } else {
                    statusLabel.innerText = "Error: Please drop a folder directory, not a lone file.";
                }
            }
        });

        // Helper to wipe the workspace inside Pyodide before new execution cycles
        async function clearVirtualFileSystem() {
            const existingFiles = pyodideInstance.FS.readdir('/');
            existingFiles.forEach(file => {
                if (file !== '.' && file !== '..') {
                    try {
                        // Wipe transient files out of memory root mapping
                        pyodideInstance.FS.unlink('/' + file);
                    } catch(e) {}
                }
            });
        }

        // 3. Recursive directory mapping handler
        async function scanAndInjectDirectory(dirEntry, currentPath) {
            const dirReader = dirEntry.createReader();
            const entries = await new Promise((resolve) => dirReader.readEntries(resolve));

            for (const entry of entries) {
                const targetVirtualPath = currentPath + (currentPath === "/" ? "" : "/") + entry.name;
                
                if (entry.isFile) {
                    const fileData = await new Promise((resolve) => entry.file(resolve));
                    const arrayBuffer = await fileData.arrayBuffer();
                    const uint8View = new Uint8Array(arrayBuffer);
                    
                    // Map directly into the virtual file system instance
                    pyodideInstance.FS.writeFile(targetVirtualPath, uint8View);
                    outputConsole.textContent += `[Loaded Asset]: ${targetVirtualPath}\n`;
                } else if (entry.isDirectory) {
                    // Replicate subdirectory folders inside the engine
                    try {
                        pyodideInstance.FS.mkdir(targetVirtualPath);
                    } catch(e){}
                    await scanAndInjectDirectory(entry, targetVirtualPath);
                }
            }
        }

        // 4. Trigger Execution 
        async function runPythonExecution() {
            statusLabel.innerText = "Running script context...";
            try {
                // Assert entrypoint constraint check
                if (!pyodideInstance.FS.readdir('/').includes('main.py')) {
                    throw new Error("Missing entry file: Target directory must include a 'main.py' script file.");
                }

                outputConsole.textContent += "\n--- RUNTIME OUTPUT START ---\n";
                
                // Execute target mapping execution path
                await pyodideInstance.runPythonAsync(`
                    import os
                    with open("main.py", "r") as f:
                        code_to_exec = f.read()
                    exec(code_to_exec, {})
                `);
                
                statusLabel.innerText = "Execution completed successfully.";
            } catch (error) {
                outputConsole.textContent += `\n[RUNTIME EXCEPTION]: ${error.message}\n`;
                statusLabel.innerText = "Execution halted due to errors.";
            }
        }

        // Kick off initialization sequence
        initSandboxEngine();
    </script>
</body>
</html>
