<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser Linux Workspace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #viewport-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: crosshair;
            background-color: #000;
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="viewport-container">
        <canvas id="displayCanvas" width="1280" height="720"></canvas>
    </div>
    <div id="status">Connecting to remote Linux session...</div>

    <script>
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        // Initialize WebSocket Connection
        const socket = new WebSocket('ws://' + window.location.hostname + ':8080');
        socket.binaryType = 'arraybuffer';

        let frameBuffer = [];

        socket.onopen = () => {
            statusDiv.textContent = 'Connected | Click canvas to capture input';
            statusDiv.style.color = '#4CAF50';
        };

        socket.onclose = () => {
            statusDiv.textContent = 'Disconnected from Linux session';
            statusDiv.style.color = '#F44336';
        };

        // Render binary frame stream onto HTML5 Canvas
        socket.onmessage = (event) => {
            if (event.data instanceof ArrayBuffer) {
                const blob = new Blob([event.data], { type: 'image/jpeg' });
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(img.src);
                };
                img.src = URL.createObjectURL(blob);
            }
        };

        // Send JSON formatted input actions to the Linux backend
        function sendInput(data) {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(data));
            }
        }

        // Pointer event interception
        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: Math.round((e.clientX - rect.left) * scaleX),
                y: Math.round((e.clientY - rect.top) * scaleY)
            };
        }

        canvas.addEventListener('mousemove', (e) => {
            const coords = getCanvasCoordinates(e);
            sendInput({ type: 'mousemove', x: coords.x, y: coords.y });
        });

        canvas.addEventListener('mousedown', (e) => {
            // Map JavaScript mouse buttons to X11 buttons (1=Left, 2=Middle, 3=Right)
            const buttonMap = { 0: 1, 1: 2, 2: 3 };
            sendInput({ type: 'mousedown', button: buttonMap[e.button] || 1 });
        });

        canvas.addEventListener('mouseup', (e) => {
            const buttonMap = { 0: 1, 1: 2, 2: 3 };
            sendInput({ type: 'mouseup', button: buttonMap[e.button] || 1 });
        });

        // Prevent standard right-click context menu over the desktop canvas
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Keyboard event interception
        window.addEventListener('keydown', (e) => {
            // Capture events only if focusing canvas
            if (document.activeElement === canvas || document.activeElement === document.body) {
                // Prevent browser standard shortcuts (e.g., Ctrl+S, Tab navigation)
                e.preventDefault();
                sendInput({ type: 'keydown', key: e.key });
            }
        });

        // Request System Keyboard Lock API (Chromium-based browsers)
        canvas.addEventListener('click', () => {
            if ('keyboard' in navigator && 'lock' in navigator.keyboard) {
                navigator.keyboard.lock(["ControlLeft", "KeyW", "Tab", "AltLeft"]).catch(console.error);
            }
        });
    </script>
</body>
</html>
